name: 🐛 Bug report
description: Report something that's broken or behaving unexpectedly on cameraderiecards.com.
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! The more detail you
        give, the faster it gets fixed.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear and concise description of the bug.
      placeholder: e.g. "The pack-cracking simulator showed $0 for Final Fantasy Collector Boosters."
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: How can we make it happen on our end?
      placeholder: |
        1. Sign in with Google
        2. Go to the Crack-a-Pack card
        3. Select "Final Fantasy Collector Booster"
        4. Click "Crack one pack"
        5. See $0 in the verdict pill
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
      placeholder: e.g. "I expected the verdict pill to show a non-zero expected value."
    validations:
      required: true
  - type: dropdown
    id: tier
    attributes:
      label: Your tier
      options:
        - Free
        - Pro Monthly
        - Lifetime
        - Not signed in
    validations:
      required: false
  - type: input
    id: browser
    attributes:
      label: Browser + version
      placeholder: e.g. Chrome 134 on macOS 15
    validations:
      required: false
  - type: textarea
    id: screenshot
    attributes:
      label: Screenshot (optional)
      description: Drag-and-drop an image here if it helps explain.
    validations:
      required: false
